name: Full GAPDH panel
output_dir: amyloscope_runlast/amyloscope_out
hypothesis: >
  PRIMARY FULL PANEL HYPOTHESIS (proposed 20 November 2026; not an outcome or
  formal preregistration). In canonical human somatic GAPDH (P04406) and
  Saccharomyces cerevisiae TDH1 (P00360), TDH2 (P00358), and TDH3 (P00359),
  consensus aggregation prone residues are hypothesized to be enriched within
  the sequence matched Pfam PF00044 NAD binding module, category
  nad_binding_module, relative to placements of nonoverlapping APR windows of
  the same lengths within each protein. H0 is no preferential overlap with
  that predefined module; H1 is greater overlap. The proposed mechanism is
  that sequences contributing to the native cofactor binding fold may also
  carry latent aggregation propensity. This is a testable proposal motivated
  by cofactor dependent GAPDH stability, not an established localization of
  GAPDH APRs. The interval is precisely the PF00044 sequence match, not the
  entire three dimensional NAD binding domain, a ligand contact map, an
  experimentally validated amyloid core, or an RNA binding annotation. NAD
  contact sites, the PF02800 catalytic domain, substrate contact sites and the
  catalytic cysteine are secondary/exploratory annotations. No new APR
  boundaries have been used to define any annotation. Positive domain
  enrichment alone would not demonstrate NAD shielding, tetramer dissociation,
  exposed beta edges, aggregation after oxidation, or amyloid formation; these
  require separate structure aware and experimental tests. NAD removal does
  not necessarily dissociate GAPDH. The four homologues, including three yeast
  paralogues, are not four independent biological replicates. Interpret the
  pooled result as a conditional positional test for this fixed panel. If APR
  outcomes have already been examined, treat this hypothesis as exploratory
  rather than preregistered.
primary_domain_category: nad_binding_module

